name: 更新離婚統計資料

on:
  schedule:
    # 每月 12 日與 22 日 02:00 UTC（台北 10:00）跑兩次，內政部約於月中發布上月資料
    - cron: "0 2 12,22 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取內政部統計
        run: python3 fetch_stats.py
      - name: 提交變更（如有）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/divorce-stats.json
          if git diff --cached --quiet; then
            echo "資料無變更"
          else
            git commit -m "自動更新離婚統計資料 ($(date +%Y-%m-%d))"
            git push
          fi
